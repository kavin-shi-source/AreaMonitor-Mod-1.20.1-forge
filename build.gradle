// Minecraft mod build script example
plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.01-forge 1.20.1'
group = 'com.kavinshi.areamonitor'

base {
    archivesName = 'areamonitor'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'areamonitor'

            mods {
                areamonitor {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.0.35'
}

tasks.named('jar', Jar) {
    archiveBaseName = 'AreaMonitor'
    archiveVersion = "${version}"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
                "Specification-Title": "areamonitor",
                "Specification-Vendor": "kavinshi",
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": "kavinshi"
        ])
    }
}